<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Cash App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding-bottom: 70px; }
        .header { padding: 20px; background-color: #2c2c2c; border-bottom: 2px solid #333; }
        .balance-card { background: linear-gradient(135deg, #4caf50, #2e7d32); margin: 20px; padding: 20px; border-radius: 15px; }
        .tabs { display: flex; justify-content: space-around; background: #2c2c2c; padding: 10px 0; position: sticky; top: 0; z-index: 10; }
        .tab { padding: 10px 15px; cursor: pointer; border-radius: 20px; opacity: 0.6; font-size: 13px; }
        .tab.active { background-color: #4caf50; opacity: 1; }
        .content { padding: 20px; }
        .hidden { display: none; }
        .btn-action { background-color: #4caf50; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .input-promo { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #2c2c2c; color: white; box-sizing: border-box; text-align: center; font-size: 18px; margin-bottom: 10px; }
        .task-card { background: #2c2c2c; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: left; border-left: 5px solid #4caf50; }
    </style>
</head>
<body>
    <div class="header"><h2>EASY CASH</h2></div>
    <div class="balance-card">
        <div style="font-size: 0.8em; opacity: 0.8;">Ваш баланс:</div>
        <div id="main-balance" style="font-size: 2.2em; font-weight: bold;">0 ₽</div>
    </div>

    <div class="tabs">
        <div id="tab-tasks" class="tab active" onclick="showTab('tasks')">Задания</div>
        <div id="tab-promo" class="tab" onclick="showTab('promo')">Промокод</div>
        <div id="tab-refs" class="tab" onclick="showTab('refs')">Рефералы</div>
        <div id="tab-out" class="tab" onclick="showTab('out')">Вывод</div>
    </div>

    <div id="content-tasks" class="content">
        <div id="tasks-list">Загрузка...</div>
    </div>

    <div id="content-promo" class="content hidden">
        <h3>Активация промокода</h3>
        <input type="text" id="promo-input" class="input-promo" placeholder="ВВЕДИТЕ КОД">
        <button class="btn-action" onclick="usePromo()">Активировать</button>
    </div>

    <div id="content-refs" class="content hidden">
        <h3>Рефералы</h3>
        <p>За друга: <b>50 ₽</b></p>
        <div id="ref-link" style="background:#333; padding:10px; border-radius:5px; word-break:break-all;">...</div>
        <button class="btn-action" onclick="copyRef()">Копировать</button>
    </div>

    <div id="content-out" class="content hidden">
        <h3>Вывод</h3>
        <p>Минимум: 1000 ₽</p>
        <button class="btn-action" style="background:#f44336" onclick="tg.showAlert('Недостаточно средств')">Вывести</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('main-balance').innerText = (urlParams.get('bal') || '0') + " ₽";
        
        // Рендер заданий
        try {
            const rawTasks = urlParams.get('tasks');
            if (rawTasks) {
                const tasks = JSON.parse(decodeURIComponent(rawTasks));
                const list = document.getElementById('tasks-list');
                list.innerHTML = tasks.length ? "" : "Нет заданий";
                tasks.forEach(t => {
                    list.innerHTML += `<div class="task-card"><strong>${t.desc}</strong><br><span style="color:#4caf50">+${t.reward} ₽</span><br><button class="btn-action" onclick="window.open('${t.url}','_blank')">Перейти</button><button class="btn-action" style="background:#2196F3" onclick="checkTask(${t.id},${t.reward})">Проверить</button></div>`;
                });
            }
        } catch(e){}

        function checkTask(id, reward) {
            tg.sendData(JSON.stringify({action:"check_task", task_id:id, reward:reward}));
            tg.close();
        }

        function usePromo() {
            const code = document.getElementById('promo-input').value;
            if(!code) return tg.showAlert("Введите код!");
            tg.sendData(JSON.stringify({action:"use_promo", code:code}));
            tg.close();
        }

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "0";
        document.getElementById('ref-link').innerText = "https://t.me/TalkingBattleBot?start=" + userId;

        function showTab(t) {
            ["tasks","promo","refs","out"].forEach(id => {
                document.getElementById('content-'+id).classList.toggle('hidden', id !== t);
                document.getElementById('tab-'+id).classList.toggle('active', id === t);
            });
        }

        function copyRef() {
            navigator.clipboard.writeText(document.getElementById('ref-link').innerText);
            tg.showAlert("Скопировано!");
        }
    </script>
</body>
</html>

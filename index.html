<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Cash App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; margin: 0; text-align: center; }
        .header { padding: 20px; background-color: #2c2c2c; border-bottom: 2px solid #333; }
        .balance-card { background: linear-gradient(135deg, #4caf50, #2e7d32); margin: 20px; padding: 20px; border-radius: 15px; }
        .tabs { display: flex; justify-content: space-around; background: #2c2c2c; padding: 10px 0; }
        .tab { padding: 10px 20px; cursor: pointer; border-radius: 20px; opacity: 0.6; }
        .tab.active { background-color: #4caf50; opacity: 1; }
        .content { padding: 20px; }
        .hidden { display: none; }
        .btn-action { background-color: #4caf50; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .referral-link { background: #333; padding: 15px; border-radius: 8px; word-break: break-all; margin-top: 10px; font-size: 14px; border: 1px dashed #555; }
        .task-card { background: #2c2c2c; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: left; border-left: 4px solid #4caf50; }
        .task-reward { color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header"><h2 id="user-greeting">EASY CASH</h2></div>

    <div class="balance-card">
        <div style="font-size: 0.9em; opacity: 0.8;">Ваш баланс:</div>
        <div id="main-balance" style="font-size: 2.3em; font-weight: bold;">0 ₽</div>
        <div style="font-size: 0.8em; margin-top: 10px;">Минимальный вывод: 1000 ₽</div>
    </div>

    <div class="tabs">
        <div id="tab-tasks" class="tab active" onclick="showTab('tasks')">Задания</div>
        <div id="tab-refs" class="tab" onclick="showTab('refs')">Рефералы</div>
    </div>

    <div id="content-tasks" class="content">
        <h3>Доступные задания</h3>
        <div id="tasks-list">
            <!-- Задания будут подгружаться сюда -->
            <p style="color: #888;">Заданий пока нет</p>
        </div>
    </div>

    <div id="content-refs" class="content hidden">
        <h3>Реферальная система</h3>
        <p>За каждого друга вы получаете <b>50 ₽</b></p>
        <div class="referral-link" id="ref-link">Загрузка...</div>
        <button class="btn-action" onclick="copyRef()">Копировать ссылку</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const userBalance = urlParams.get('bal') || '0';
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "0";
        const userName = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "Друг";

        document.getElementById('main-balance').innerText = userBalance + " ₽";
        document.getElementById('user-greeting').innerText = "Привет, " + userName + "!";
        
        // Замени на юзернейм своего бота
        const botUsername = "TalkingBattleBot"; 
        document.getElementById('ref-link').innerText = "https://t.me/" + botUsername + "?start=" + userId;

        function showTab(tab) {
            if (tab === 'tasks') {
                document.getElementById('content-tasks').classList.remove('hidden');
                document.getElementById('content-refs').classList.add('hidden');
                document.getElementById('tab-tasks').classList.add('active');
                document.getElementById('tab-refs').classList.remove('active');
            } else {
                document.getElementById('content-tasks').classList.add('hidden');
                document.getElementById('content-refs').classList.remove('hidden');
                document.getElementById('tab-tasks').classList.remove('active');
                document.getElementById('tab-refs').classList.add('active');
            }
        }

        function copyRef() {
            navigator.clipboard.writeText(document.getElementById('ref-link').innerText);
            tg.showAlert("Ссылка скопирована!");
        }
    </script>
</body>
</html>

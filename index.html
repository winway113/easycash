<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Cash App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; margin: 0; padding-bottom: 50px; }
        .header { padding: 20px; background-color: #2c2c2c; border-bottom: 2px solid #333; }
        .balance-card { background: linear-gradient(135deg, #4caf50, #2e7d32); margin: 20px; padding: 20px; border-radius: 15px; }
        .tabs { display: flex; justify-content: space-around; background: #2c2c2c; padding: 10px 0; }
        .tab { padding: 10px 20px; cursor: pointer; border-radius: 20px; opacity: 0.6; }
        .tab.active { background-color: #4caf50; opacity: 1; }
        .content { padding: 20px; }
        .hidden { display: none; }
        .btn-action { background-color: #4caf50; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; }
        .task-card { background: #2c2c2c; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: left; border-left: 5px solid #4caf50; }
        .referral-link { background: #333; padding: 15px; border-radius: 8px; word-break: break-all; margin-top: 10px; border: 1px dashed #555; }
    </style>
</head>
<body>
    <div class="header"><h2 id="user-greeting">EASY CASH</h2></div>
    <div class="balance-card">
        <div style="font-size: 0.8em; opacity: 0.8;">Ваш баланс:</div>
        <div id="main-balance" style="font-size: 2em; font-weight: bold;">0 ₽</div>
    </div>

    <div class="tabs">
        <div id="tab-tasks" class="tab active" onclick="showTab('tasks')">Задания</div>
        <div id="tab-refs" class="tab" onclick="showTab('refs')">Рефералы</div>
    </div>

    <div id="content-tasks" class="content">
        <div id="tasks-list">Загрузка заданий...</div>
    </div>

    <div id="content-refs" class="content hidden">
        <h3>Рефералы</h3>
        <p>За друга: <b>50 ₽</b></p>
        <div class="referral-link" id="ref-link">...</div>
        <button class="btn-action" onclick="copyRef()">Копировать</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('main-balance').innerText = (urlParams.get('bal') || '0') + " ₽";
        
        // РЕНДЕР ЗАДАНИЙ
        const tasksData = urlParams.get('tasks');
        const tasksList = document.getElementById('tasks-list');
        
        if (tasksData) {
            const tasks = JSON.parse(tasksData);
            tasksList.innerHTML = "";
            if (tasks.length === 0) {
                tasksList.innerHTML = "Пока нет заданий от админа.";
            } else {
                tasks.forEach(t => {
                    tasksList.innerHTML += `
                        <div class="task-card">
                            <strong>${t.desc}</strong><br>
                            <span style="color:#4caf50">+${t.reward} ₽</span>
                            <button class="btn-action" onclick="window.open('${t.url}', '_blank')">Выполнить</button>
                        </div>`;
                });
            }
        }

        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "0";
        document.getElementById('ref-link').innerText = "https://t.me/TalkingBattleBot?start=" + userId;

        function showTab(t) {
            document.getElementById('content-tasks').classList.toggle('hidden', t !== 'tasks');
            document.getElementById('content-refs').classList.toggle('hidden', t !== 'refs');
            document.getElementById('tab-tasks').classList.toggle('active', t === 'tasks');
            document.getElementById('tab-refs').classList.toggle('active', t === 'refs');
        }

        function copyRef() {
            navigator.clipboard.writeText(document.getElementById('ref-link').innerText);
            tg.showAlert("Готово!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Cash App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .header {
            padding: 20px;
            background-color: #2c2c2c;
            border-bottom: 2px solid #333;
        }
        .balance-card {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            margin: 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            background: #2c2c2c;
            padding: 10px 0;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 20px;
        }
        .tab.active {
            background-color: #4caf50;
        }
        .content {
            padding: 20px;
        }
        .hidden { display: none; }
        .btn-action {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 10px;
            width: 100%;
            font-size: 16px;
        }
        .referral-link {
            background: #333;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>EASY CASH</h2>
    </div>

    <div class="balance-card">
        <div style="font-size: 0.9em; opacity: 0.8;">Доступно к выводу:</div>
        <div style="font-size: 2em; font-weight: bold;">0.00 ₽</div>
        <div style="font-size: 0.8em; margin-top: 10px;">Минимальный вывод: 1000 ₽</div>
    </div>

    <div class="tabs">
        <div id="tab-tasks" class="tab active" onclick="showTab('tasks')">Задания</div>
        <div id="tab-refs" class="tab" onclick="showTab('refs')">Рефералы</div>
    </div>

    <!-- Вкладка ЗАДАНИЯ -->
    <div id="content-tasks" class="content">
        <h3>Доступные задания</h3>
        <p style="color: #888;">Пока нет новых заданий.<br>Админ добавит их скоро!</p>
    </div>

    <!-- Вкладка РЕФЕРАЛЫ -->
    <div id="content-refs" class="content hidden">
        <h3>Реферальная система</h3>
        <p>Приглашай друзей и получай бонусы!</p>
        <div class="referral-link" id="ref-link">Загрузка ссылки...</div>
        <button class="btn-action" onclick="copyRef()">Копировать ссылку</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        function showTab(tab) {
            if (tab === 'tasks') {
                document.getElementById('content-tasks').classList.remove('hidden');
                document.getElementById('content-refs').classList.add('hidden');
                document.getElementById('tab-tasks').classList.add('active');
                document.getElementById('tab-refs').classList.remove('active');
            } else {
                document.getElementById('content-tasks').classList.add('hidden');
                document.getElementById('content-refs').classList.remove('hidden');
                document.getElementById('tab-tasks').classList.remove('active');
                document.getElementById('tab-refs').classList.add('active');
                
                // Генерируем ссылку (пока просто пример)
                let userId = tg.initDataUnsafe.user.id;
                document.getElementById('ref-link').innerText = "https://t.me/ТВОЙ_БОТ?start=" + userId;
            }
        }

        function copyRef() {
            let link = document.getElementById('ref-link').innerText;
            navigator.clipboard.writeText(link);
